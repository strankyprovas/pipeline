name: Daily Outreach Pipeline

# Odvětví se střídají po dnech (2 denně) místo 9 naráz. Důvody:
#   - 9 paralelních jobů narazilo na kvótu Google Sheets (chyba 429)
#   - 180 min/obor: běh projde ~35 měst místo 9 (cca 5 min na město)
# Ruční spuštění: workflow_dispatch → pole "industry" (prázdné = dnešní dvojice).

on:
  schedule:
    # Večerní start schválně: 3 obory × 180 min = až 9 h běhu. Přes den by to
    # drželo concurrency group a odesílací dávky by vůbec nenaskočily (stalo se
    # 4. 8. slotu 13:30). V noci je okno volné a drafty ráno čekají hotové.
    - cron: '0 17 * * *'   # cca 19:30 UTC reálně (GitHub startuje se zpožděním)
  workflow_dispatch:
    inputs:
      industry:
        description: 'Jedno odvětví (prázdné = dnešní dvojice dle dne v týdnu)'
        required: false
        default: ''

concurrency:
  group: google-oauth-token
  cancel-in-progress: false

jobs:
  plan:
    name: Naplánuj odvětví
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.pick.outputs.matrix }}
    steps:
      - name: Vyber odvětví podle dne v týdnu
        id: pick
        env:
          MANUAL: ${{ github.event.inputs.industry }}
        run: |
          set -euo pipefail
          if [ -n "${MANUAL:-}" ]; then
            MATRIX="[\"$MANUAL\"]"
          else
            # 1 = pondělí … 7 = neděle (runner běží v UTC)
            #
            # Rozdělení slotů podle NAMĚŘENÉ odezvy (report z 8. 8. 2026,
            # reports/outreach-2026-08-08.md, 14 960 odeslaných mailů):
            #   masáže 1,1 % ▲ | penzion 0,8 % ▲ | psycholog 0,7 % | kavárna 0,5 %
            #   kadeřnictví 0,4 % | kosmetika/zubní/autoservis 0,3 % | restaurace 0,2 % ▼
            # Intervaly restaurací (0,1–0,5 %) a masáží (0,7–1,7 %) se nepřekrývají,
            # takže to není šum. Restaurace přitom měly dosud největší objem ze všech
            # oborů (3 067 mailů) při nejhorší odezvě.
            #
            # Slotů je 21 za týden. Nově: masáže 4, penzion 3, psycholog 3, kavárna 3,
            # kadeřnictví 2, zbytek po jednom. Každý obor má aspoň jeden slot schválně –
            # pekárny (131 mailů) a květinářství (24) zatím nemají dost dat na soud
            # a bez slotu by je nikdy nezískaly.
            #
            # ⚠️ Masáže teď projedou seznam měst 4× rychleji než dřív. Až se začne
            # vracet málo leadů na město, bude to tím – ne rozbitou pipeline.
            case "$(date -u +%u)" in
              1) MATRIX='["masaze","penzion","psycholog"]' ;;
              2) MATRIX='["kavarna","kadernictvi","restaurace"]' ;;
              3) MATRIX='["masaze","psycholog","kosmetika"]' ;;
              4) MATRIX='["penzion","kavarna","zubni"]' ;;
              5) MATRIX='["masaze","psycholog","kadernictvi"]' ;;
              6) MATRIX='["penzion","kavarna","autoservis"]' ;;
              7) MATRIX='["masaze","pekarna","kvetinarstvi"]' ;;
            esac
          fi
          echo "matrix=$MATRIX" >> "$GITHUB_OUTPUT"
          echo "Dnešní odvětví: $MATRIX"

  run-industry:
    name: ${{ matrix.industry }}
    needs: plan
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        industry: ${{ fromJSON(needs.plan.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # persist-credentials: false → checkout NEuloží do .git/config hlavičku
          # s GITHUB_TOKENem. Ta má jen čtecí právo a přebíjela přepis přes GH_PAT
          # níž, takže push pozice v seznamu měst končil 403 (viz krok "Ulož pozici").
          # Dema se pushovala v pořádku jen proto, že jejich repo se klonuje zvlášť
          # a žádnou takovou hlavičku nemá.
          persist-credentials: false
          # Rebase před pushem potřebuje historii, mělký klon ji nemá.
          fetch-depth: 0

      - name: Instaluj Python závislosti
        run: |
          pip install -q \
            requests gspread google-auth google-auth-oauthlib \
            google-auth-httplib2 google-api-python-client \
            anthropic beautifulsoup4 dnspython playwright

      - name: Nainstaluj Chromium pro Playwright
        # firmy_scraper.py jede přes playwright.chromium – bez tohohle kroku
        # padá na "No module named 'playwright'" a Firmy.cz se přeskočí.
        # A protože OSM skoro nemá e-maily, znamená to nula použitelných leadů.
        run: playwright install --with-deps chromium

      - name: Obnov Google credentials
        run: |
          echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > credentials.json
          echo '${{ secrets.GOOGLE_TOKEN_PICKLE_B64 }}' | base64 -d > token.pickle

      - name: Nastav Git
        run: |
          git config --global user.name "StrankyProVas Bot"
          git config --global user.email "matyas.vrbaa@gmail.com"
          git config --global url."https://x-access-token:${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"

      - name: Naklonuj demo repo
        run: |
          python3 -c "
          import subprocess
          DEMO_DIRS = {
            'restaurace':   ('restaurace',   'demos'),
            'kavarna':      ('kavarny',      'demos-kavarny'),
            'pekarna':      ('pekarna',      'demos-pekarna'),
            'kvetinarstvi': ('kvetinarstvi', 'demos-kvetinarstvi'),
            'penzion':      ('penzion',      'demos-penziony'),
            'kadernictvi':  ('kadernictvi',  'demos-kadernictvi'),
            'kosmetika':    ('kosmetika',    'demos-kosmetika'),
            'autoservis':   ('autoservis',   'demos-autoservis'),
            'masaze':       ('masaze',       'demos-masaze'),
            'zubni':        ('zubni',        'demos-zubni'),
            'psycholog':    ('psycholog',    'demos-psycholog'),
          }
          industry = '${{ matrix.industry }}'
          repo, demo_dir = DEMO_DIRS[industry]
          url = f'https://github.com/strankyprovas/{repo}.git'
          subprocess.run(['git', 'clone', '--depth=1', url, demo_dir], check=True)
          print(f'Naklonováno: {demo_dir}')
          "

      - name: Spusť pipeline
        # AI personalizace je vypnutá – organizace nemá kredity na Anthropic API.
        # Bez klíče ai_email.generate_ai_email() rovnou vrací šablonový email
        # (fallback), takže pipeline běží dál, jen s méně osobními texty.
        # Až budou kredity, stačí odkomentovat oba řádky níž.
        # env:
        #   ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python3 run_all_cities.py --industry ${{ matrix.industry }} --target 6

      - name: Dopush zbylá dema
        # Dema se pushují dávkově (max 1× za 10 min kvůli limitu buildů GitHub Pages).
        # Job ale VŽDY skončí na timeoutu, takže poslední dávka zůstane nenahraná
        # a draft, který na ni odkazuje, míří na 404. Tenhle krok to dožene.
        if: always()
        run: |
          python3 - <<'PY'
          import subprocess
          industry = "${{ matrix.industry }}"
          DIRS = {
            'restaurace':'demos','kavarna':'demos-kavarny','pekarna':'demos-pekarna',
            'kvetinarstvi':'demos-kvetinarstvi','penzion':'demos-penziony',
            'kadernictvi':'demos-kadernictvi','kosmetika':'demos-kosmetika',
            'autoservis':'demos-autoservis','masaze':'demos-masaze',
            'zubni':'demos-zubni','psycholog':'demos-psycholog',
          }
          d = DIRS[industry]
          subprocess.run(['git','-C',d,'add','-A'], check=False)
          r = subprocess.run(['git','-C',d,'commit','-m',f'Dopush dem ({industry})'],
                             capture_output=True, text=True)
          print(r.stdout.strip() or r.stderr.strip())
          p = subprocess.run(['git','-C',d,'push','origin','master'],
                             capture_output=True, text=True)
          print(p.stdout.strip() or p.stderr.strip() or 'push OK')
          PY

      - name: Ulož pozici v seznamu měst
        # Bez toho začíná každý běh znovu od prvního města. U vytěženého oboru
        # se pak celé okno spotřebuje odmítáním kontaktů, které už v DB jsou.
        if: always()
        run: |
          if [ -z "$(git status --porcelain state/ 2>/dev/null)" ]; then
            echo "Žádná změna pozice k uložení."
            exit 0
          fi
          echo "Ukládám pozici: $(cat state/${{ matrix.industry }}.txt 2>/dev/null)"
          git add state/
          git commit -m "Pozice v seznamu měst: ${{ matrix.industry }}"
          # Druhý obor běží ve vlastním checkoutu, proto rebase před pushem.
          for i in 1 2 3; do
            git pull --rebase --autostash origin main && git push origin HEAD:main && exit 0
            echo "pokus $i selhal, zkouším znovu"
            sleep 5
          done
          # Chyba, ne warning: když tohle selže, začne příští běh zase od prvního
          # města a celé tříhodinové okno se spotřebuje na kontakty, které už
          # v databázi jsou. Přesně tohle se dělo tiše od 3. 8. 2026.
          echo "::error::Pozici v seznamu měst se nepodařilo uložit (${{ matrix.industry }})"
          exit 1

      - name: Ověř, že se dema opravdu zveřejnila
        # Bez tohohle kroku pipeline tiše "uspěje", i když push dem selže –
        # přesně to se dělo od července: dema 404, sender je odmítl,
        # odešlo 0 e-mailů a v logu nic nekřičelo.
        if: always()
        run: |
          python3 - <<'PY'
          import subprocess, sys
          industry = "${{ matrix.industry }}"
          DIRS = {
            'restaurace':'demos','kavarna':'demos-kavarny','pekarna':'demos-pekarna',
            'kvetinarstvi':'demos-kvetinarstvi','penzion':'demos-penziony',
            'kadernictvi':'demos-kadernictvi','kosmetika':'demos-kosmetika',
            'autoservis':'demos-autoservis','masaze':'demos-masaze',
            'zubni':'demos-zubni','psycholog':'demos-psycholog',
          }
          d = DIRS[industry]
          out = subprocess.run(['git','-C',d,'log','origin/master..HEAD','--oneline'],
                               capture_output=True, text=True).stdout.strip()
          if out:
              print(f"::error::{len(out.splitlines())} dem zůstalo nepushnutých -> "
                    f"budou 404 a sender je přeskočí:\n{out}")
              sys.exit(1)
          print("OK: všechna vygenerovaná dema jsou nahraná na GitHub Pages.")
          PY
