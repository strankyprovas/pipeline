name: Send Drafts

# Rozesílá připravené Gmail drafty po dávkách.
#
# ⚠️ Sdílí `concurrency: google-oauth-token` s Daily Outreach Pipeline.
# Obě workflow obnovují TÝŽ Google refresh token a souběžné obnovení
# Google vyhodnotí jako reuse → token zneplatní (stalo se už dvakrát).
# Stejná concurrency group je drží v řadě za sebou, nikdy vedle sebe.
#
# Pojistky uvnitř send_drafts.py (neměnit bez rozmyslu):
#   - přeskočí naše stávající klienty (EXCLUDED_EMAILS / EXCLUDED_KEYWORDS)
#   - přeskočí kontakty se stavem "osloveno" v Google Sheetu
#   - NEODEŠLE mail, jehož demo neodpovídá 200 (jinak by příjemce klikl na 404)

on:
  schedule:
    # Pipeline se přesunula na večer, celý den je proto volný.
    # GitHub spouští naplánované běhy u public repa se zpožděním ~1 h
    # (cron 6:00 → reálný start 7:02, cron 13:00 → 14:06), s tím sloty počítají.
    #
    # 7. 8. 2026: přidán třetí slot (3×20 = 60 mailů/den). Výroba běží ~90 draftů
    # denně, odesílalo se 40 – fronta rostla asi o 50 draftů denně a protože
    # sender bere od nejnovějšího, její starý konec by se na řadu nedostal nikdy.
    # Pondělí dobráno taky (pipeline jede 7 dní v týdnu, odesílalo se jen Út–Pá).
    # Sloty MUSÍ zůstat mimo okno pipeline: ta drží stejnou concurrency group
    # od ~18:20 UTC do ~03:30 UTC (3 obory × 180 min).
    #
    # 5. 9. 2026: 3×20 Po–Pá (300/týden) nestíhalo — ve frontě leželo ~4000
    # draftů a výroba přidávala víc, než se odeslalo. Rozšířeno na 4 sloty
    # a všech 7 dní: 80/den, 560/týden. Výroba běží 7 dní v týdnu, takže
    # víkendy byly zadarmo ležící kapacita.
    # Čtvrtý slot je v 15:00 UTC (reálně ~16:06) — musí skončit s rezervou
    # před 18:20 UTC, kdy si stejnou concurrency group bere pipeline.
    - cron: '0 6 * * *'
    - cron: '0 9 * * *'
    - cron: '0 13 * * *'
    - cron: '0 15 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max. počet e-mailů za tento běh'
        required: false
        default: '20'
      dry_run:
        description: 'Jen vypsat, nic neodesílat (true/false)'
        required: false
        default: 'false'

concurrency:
  group: google-oauth-token
  cancel-in-progress: false

jobs:
  send:
    name: Odeslat drafty
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instaluj Python závislosti
        run: |
          pip install -q \
            requests gspread google-auth google-auth-oauthlib \
            google-auth-httplib2 google-api-python-client \
            dnspython

      - name: Obnov Google credentials
        run: |
          echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > credentials.json
          echo '${{ secrets.GOOGLE_TOKEN_PICKLE_B64 }}' | base64 -d > token.pickle

      - name: Odešli drafty
        env:
          LIMIT: ${{ github.event.inputs.limit || '20' }}
          DRY: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          set -euo pipefail
          # --delay 90 s rozptylem ±50 % = 45–135 s mezi maily. Pevný takt
          # vypadá strojově; 20 mailů tak trvá ~30 min, do timeoutu se vejde.
          # --skip-no-mx zahodí adresy, jejichž doména neexistuje — odrazy
          # kazí pověst odesílatele rychleji než cokoliv jiného.
          FLAGS="--delay 90 --jitter 0.5 --skip-no-mx --limit $LIMIT"
          if [ "$DRY" = "true" ]; then
            FLAGS="$FLAGS --dry-run"
          fi
          echo "Spouštím: send_drafts.py $FLAGS"
          python3 send_drafts.py $FLAGS
