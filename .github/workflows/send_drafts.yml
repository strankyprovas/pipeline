name: Send Drafts

# Rozesílá připravené Gmail drafty po dávkách.
#
# ⚠️ Sdílí `concurrency: google-oauth-token` s Daily Outreach Pipeline.
# Obě workflow obnovují TÝŽ Google refresh token a souběžné obnovení
# Google vyhodnotí jako reuse → token zneplatní (stalo se už dvakrát).
# Stejná concurrency group je drží v řadě za sebou, nikdy vedle sebe.
#
# Pojistky uvnitř send_drafts.py (neměnit bez rozmyslu):
#   - přeskočí naše stávající klienty (EXCLUDED_EMAILS / EXCLUDED_KEYWORDS)
#   - přeskočí kontakty se stavem "osloveno" v Google Sheetu
#   - NEODEŠLE mail, jehož demo neodpovídá 200 (jinak by příjemce klikl na 404)

on:
  schedule:
    # Pipeline se přesunula na večer, celý den je proto volný.
    # GitHub spouští naplánované běhy u public repa se zpožděním ~1 h
    # (cron 6:00 → reálný start 7:02, cron 13:00 → 14:06), s tím sloty počítají.
    #
    # 7. 8. 2026: přidán třetí slot (3×20 = 60 mailů/den). Výroba běží ~90 draftů
    # denně, odesílalo se 40 – fronta rostla asi o 50 draftů denně a protože
    # sender bere od nejnovějšího, její starý konec by se na řadu nedostal nikdy.
    # Pondělí dobráno taky (pipeline jede 7 dní v týdnu, odesílalo se jen Út–Pá).
    # Sloty MUSÍ zůstat mimo okno pipeline: ta drží stejnou concurrency group
    # od ~18:20 UTC do ~03:30 UTC (3 obory × 180 min).
    #
    # 5. 9. 2026: 3×20 Po–Pá (300/týden) nestíhalo — ve frontě leželo ~4000
    # draftů a výroba přidávala víc, než se odeslalo. Rozšířeno na 4 sloty
    # a všech 7 dní: 80/den, 560/týden. Výroba běží 7 dní v týdnu, takže
    # víkendy byly zadarmo ležící kapacita.
    # 6. 9. 2026: dávka 20 → 30, tedy 120/den a 840/týden.
    # Téhož dne na přání navýšeno na 8 slotů × 50 = 400/den.
    # 7. 9. 2026: 9 slotů × 50 = 450/den.
    # 10. 9. 2026: GitHub sloty spouští nespolehlivě — 8. 9. vypadl celý den,
    # ranní sloty vypadávají běžně; reálně se tak posílalo ~300/den. Proto je
    # slotů 12 (po hodině, 4:00–15:00) a skutečný objem hlídá --daily-cap 60
    # ve skriptu: počítá dnešní odeslání z tabulky, takže funguje napříč běhy
    # a vypadlé sloty dohoní ty další. Poslední slot (reálně ~16:00) skončí
    # do ~16:50, s rezervou před večerní pipeline (18:20).
    #
    # ⚠️ POZOR, tohle je blízko hrany. Strop běžného Gmailu je 500 příjemců
    # za den; s follow-upy (10/den) jsme na ~410 a rezerva je jen ~90.
    # Při překročení Google odesílání zamkne na 24 h.
    # Navíc: do 5. 9. každý outreach mail propadal na SPF (v záznamu domény
    # chyběl Google), takže pověst je poškozená a tenhle skok jde proti
    # doporučenému postupnému náběhu. Rozhodnutí uživatele, zdokumentováno.
    #
    # 7. 10. 2026: sloty zdvojeny na :00 i :30 (24/den) — GitHub crony
    # vypadávají (7. 10. nespustil ANI JEDEN z 8 ranních slotů); víc
    # pokusů = vyšší šance, že aspoň část projde. Objem dál hlídá
    # --daily-cap 60, takže zdvojení slotů objem NEzvyšuje.
    # Sloty po 1,5 h, poslední v 14:30 UTC (reálně ~15:36) skončí kolem
    # 16:30 — s rezervou před 18:20, kdy si concurrency group bere pipeline.
    # Čtvrtý slot je v 15:00 UTC (reálně ~16:06) — musí skončit s rezervou
    # před 18:20 UTC, kdy si stejnou concurrency group bere pipeline.
    - cron: '0 4 * * *'
    - cron: '30 4 * * *'
    - cron: '0 5 * * *'
    - cron: '30 5 * * *'
    - cron: '0 6 * * *'
    - cron: '30 6 * * *'
    - cron: '0 7 * * *'
    - cron: '30 7 * * *'
    - cron: '0 8 * * *'
    - cron: '30 8 * * *'
    - cron: '0 9 * * *'
    - cron: '30 9 * * *'
    - cron: '0 10 * * *'
    - cron: '30 10 * * *'
    - cron: '0 11 * * *'
    - cron: '30 11 * * *'
    - cron: '0 12 * * *'
    - cron: '30 12 * * *'
    - cron: '0 13 * * *'
    - cron: '30 13 * * *'
    - cron: '0 14 * * *'
    - cron: '30 14 * * *'
    - cron: '0 15 * * *'
    - cron: '30 15 * * *'
    # 28. 11. 2026: hlídací sloty. Mimo odesílací okno nic neodešlou, jen
    # zkontrolují, jestli už běžela noční generace, a když ne, spustí ji.
    # Jsou tu proto, že GitHub plánované běhy zpožďuje jednou o hodinu a jindy
    # o osm, takže na konkrétní čas cronu se nedá spolehnout.
    - cron: '15 16-23 * * *'
    - cron: '15 0-2 * * *'
  workflow_dispatch:
    inputs:
      limit:
        description: 'Max. počet e-mailů za tento běh'
        required: false
        default: '50'
      dry_run:
        description: 'Jen vypsat, nic neodesílat (true/false)'
        required: false
        default: 'false'

# 28. 11. 2026: zámek `google-oauth-token` je nově jen na jobu `send`, ne na
# celém workflow. Běh, který nemá co odeslat (mimo okno), tak do fronty vůbec
# nevstoupí a nevytlačí z ní čekající generaci ani follow-upy.
jobs:
  okno:
    name: Brána — smí se teď odesílat?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      odesilat: ${{ steps.cas.outputs.odesilat }}
    steps:
      # Rozhoduje SKUTEČNÝ čas, ne čas cronu. GitHub sloty zpožďuje až o 8 h,
      # takže ranní slot klidně dorazí o půlnoci. Odesílá se 5:00–18:00 UTC
      # (6–19 h našeho zimního času); zbytek dne patří generaci.
      - name: Kolik je doopravdy hodin
        id: cas
        env:
          UDALOST: ${{ github.event_name }}
        run: |
          set -euo pipefail
          HODINA=$((10#$(date -u +%H)))
          if [ "$UDALOST" = "workflow_dispatch" ]; then
            echo "Ruční spuštění — odesílám bez ohledu na čas."
            echo "odesilat=true" >> "$GITHUB_OUTPUT"
          elif [ "$HODINA" -ge 5 ] && [ "$HODINA" -lt 18 ]; then
            echo "Je $HODINA h UTC — odesílací okno, pouštím odesílání."
            echo "odesilat=true" >> "$GITHUB_OUTPUT"
          else
            echo "Je $HODINA h UTC — mimo odesílací okno (5–18 UTC), neodesílám."
            echo "odesilat=false" >> "$GITHUB_OUTPUT"
          fi

      # ── Noční generace se spouští odsud ──
      # Vlastní cron generace GitHub buď vynechal (26. 11. třetí den po sobě),
      # nebo doručil o 8 h později, a ta pak běžela přes odesílací okno
      # (28. 11. se kvůli tomu neodeslalo nic). Proto generaci startuje první
      # slot, který dorazí po konci odesílacího okna. Když už dnes v noci
      # běžela, nespustí se podruhé.
      # Musí jít přes GH_PAT: běh spuštěný výchozím GITHUB_TOKENem nový
      # workflow nenastartuje.
      - name: Spustit noční generaci, pokud ještě neběžela
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GH_PAT }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          HHMM=$((10#$(date -u +%H%M)))
          # 18:10–02:59 UTC. Těch 10 minut je rezerva, aby generace nevstoupila
          # do fronty dřív než poslední odesílací běh z konce okna.
          if [ "$HHMM" -lt 1810 ] && [ "$HHMM" -ge 300 ]; then
            echo "Je $(date -u +%H:%M) UTC — generace se spouští až 18:10–03:00, přeskakuji."
            exit 0
          fi
          POSLEDNI=$(gh run list --workflow daily_pipeline.yml --limit 1 \
            --json createdAt --jq '.[0].createdAt // empty' || true)
          if [ -z "$POSLEDNI" ]; then
            echo "Generace zatím nikdy neběžela, spouštím."
            gh workflow run daily_pipeline.yml
            exit 0
          fi
          # Runner je Ubuntu, takže GNU date rozumí ISO tvaru "...Z" přímo.
          STARI=$(( ( $(date -u +%s) - $(date -u -d "$POSLEDNI" +%s) ) / 3600 ))
          echo "Poslední generace spuštěna před $STARI h ($POSLEDNI)."
          if [ "$STARI" -ge 14 ]; then
            echo "Dnes v noci ještě neběžela — spouštím ji."
            gh workflow run daily_pipeline.yml
          else
            echo "Generace už dnes v noci běžela nebo běží, nic nespouštím."
          fi

  send:
    name: Odeslat drafty
    needs: okno
    if: needs.okno.outputs.odesilat == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: google-oauth-token
      cancel-in-progress: false
    # 18. 9. 2026: timeout zvednut kvuli dorovnavacim davkam (limit až 250
    # při ~72 s/mail ≈ 5 h). Bezne slotove behy po 50 konci do hodiny.
    timeout-minutes: 350

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instaluj Python závislosti
        run: |
          pip install -q \
            requests gspread google-auth google-auth-oauthlib \
            google-auth-httplib2 google-api-python-client \
            dnspython

      - name: Obnov Google credentials
        run: |
          echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > credentials.json
          echo '${{ secrets.GOOGLE_TOKEN_PICKLE_B64 }}' | base64 -d > token.pickle

      - name: Odešli drafty
        env:
          LIMIT: ${{ github.event.inputs.limit || '50' }}
          DRY: ${{ github.event.inputs.dry_run || 'false' }}
          # M365 SMTP (doručitelnost): prázdné = jede Gmail jako dřív.
          # Aktivace: nastavit secrets M365_SMTP_USER (matyas@strankyprovas.cz)
          # a M365_SMTP_PASS + v M365 povolit "Authenticated SMTP" pro schránku.
          M365_SMTP_USER: ${{ secrets.M365_SMTP_USER }}
          M365_SMTP_PASS: ${{ secrets.M365_SMTP_PASS }}
          # 26. 11. 2026: rotace víc odesílacích schránek (druhá doména
          # stranky-pro-vas.cz) — formát "user:heslo|user:heslo|...".
          # Když je vyplněné, má přednost před M365_SMTP_USER/PASS výše.
          M365_ACCOUNTS: ${{ secrets.M365_ACCOUNTS }}
          # Odpovědi sbíráme na hlavní adrese (forward do Gmailu → detekce odpovědí).
          M365_REPLY_TO: matyas@strankyprovas.cz
        run: |
          set -euo pipefail
          # Takt ~1 mail/min (--delay 60, rozptyl ±25 % = 45–75 s).
          # Dávka 50 × max 75 s ≈ 62 min → timeout zvednut na 80 min.
          # --skip-no-mx zahodí adresy, jejichž doména neexistuje — odrazy
          # kazí pověst odesílatele rychleji než cokoliv jiného.
          FLAGS="--delay 60 --jitter 0.25 --skip-no-mx --limit $LIMIT --daily-cap 60"
          if [ "$DRY" = "true" ]; then
            FLAGS="$FLAGS --dry-run"
          fi
          echo "Spouštím: send_drafts.py $FLAGS"
          python3 send_drafts.py $FLAGS
