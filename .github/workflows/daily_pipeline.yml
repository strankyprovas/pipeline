name: Daily Outreach Pipeline

on:
  schedule:
    - cron: '0 7 * * *'   # každý den v 8:00 CET (7:00 UTC)
  workflow_dispatch:        # možnost spustit ručně z GitHubu

jobs:
  run-industry:
    name: ${{ matrix.industry }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        industry:
          - restaurace
          - kavarna
          - penzion
          - kosmetika
          - kadernictvi
          - zubni
          - masaze
          - autoservis
          - psycholog

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instaluj Python závislosti
        run: |
          pip install -q \
            requests gspread google-auth google-auth-oauthlib \
            google-auth-httplib2 google-api-python-client \
            anthropic beautifulsoup4 dnspython

      - name: Obnov Google credentials
        run: |
          echo '${{ secrets.GOOGLE_CREDENTIALS_JSON }}' > credentials.json
          echo '${{ secrets.GOOGLE_TOKEN_PICKLE_B64 }}' | base64 -d > token.pickle

      - name: Nastav Git
        run: |
          git config --global user.name "StrankyProVas Bot"
          git config --global user.email "matyas.vrbaa@gmail.com"
          git config --global url."https://x-access-token:${{ secrets.GH_PAT }}@github.com/".insteadOf "https://github.com/"

      - name: Naklonuj demo repo
        run: |
          python3 -c "
          import subprocess
          DEMO_DIRS = {
            'restaurace':  ('restaurace',  'demos'),
            'kavarna':     ('kavarny',     'demos-kavarny'),
            'penzion':     ('penzion',     'demos-penziony'),
            'kadernictvi': ('kadernictvi', 'demos-kadernictvi'),
            'kosmetika':   ('kosmetika',   'demos-kosmetika'),
            'autoservis':  ('autoservis',  'demos-autoservis'),
            'masaze':      ('masaze',      'demos-masaze'),
            'zubni':       ('zubni',       'demos-zubni'),
            'psycholog':   ('psycholog',   'demos-psycholog'),
          }
          industry = '${{ matrix.industry }}'
          repo, demo_dir = DEMO_DIRS[industry]
          url = f'https://github.com/strankyprovas/{repo}.git'
          subprocess.run(['git', 'clone', '--depth=1', url, demo_dir], check=True)
          print(f'Naklonováno: {demo_dir}')
          "

      - name: Spusť pipeline
        # AI personalizace je vypnutá – organizace nemá kredity na Anthropic API.
        # Bez klíče ai_email.generate_ai_email() rovnou vrací šablonový email
        # (fallback), takže pipeline běží dál, jen s méně osobními texty.
        # Až budou kredity, stačí odkomentovat oba řádky níž.
        # env:
        #   ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          python3 run_all_cities.py --industry ${{ matrix.industry }} --target 2
